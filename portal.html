<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สถานะการติดตั้ง — Plan B Media</title>
<meta property="og:title" content="รายงานสถานะติดตั้งสื่อโฆษณา — Plan B Media">
<meta property="og:description" content="ดูความคืบหน้าการติดตั้ง รูปหน้างานจริง และแผนที่จุดติดตั้ง อัปเดตแบบเรียลไทม์">
<meta property="og:type" content="website">
<meta name="description" content="รายงานสถานะติดตั้งสื่อโฆษณา Plan B Media — อัปเดตเรียลไทม์จากหน้างานจริง">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --f: 'Segoe UI', Sarabun, Tahoma, sans-serif;
  --lime: #a4c639; --lime-dark: #7a9420;
  --ink: #1a1a1a; --mu: #777; --line: #e8e8e8; --bg: #f7f8f6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--f); background:var(--bg); color:var(--ink); }
.wrap { max-width:640px; margin:0 auto; padding:0 16px 60px; }
.topbar { background:#111; color:#fff; padding:14px 0; }
.topbar-in { max-width:640px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:10px; }
.logo { background:var(--lime); color:#111; font-weight:800; font-size:13px; padding:4px 10px; border-radius:6px; letter-spacing:.5px; }
.topbar-t { font-size:13px; color:#bbb; }
.head { padding:26px 0 6px; }
.media-badge { display:inline-block; background:#eef3dc; color:var(--lime-dark); font-size:12px; font-weight:600; padding:4px 12px; border-radius:20px; margin-bottom:8px; }
h1 { font-size:24px; font-weight:700; }
.dates { font-size:13px; color:var(--mu); margin-top:6px; }
.prog-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin:18px 0; }
.prog-nums { display:flex; align-items:baseline; gap:8px; }
.prog-big { font-size:36px; font-weight:800; color:var(--lime-dark); }
.prog-sub { font-size:14px; color:var(--mu); }
.prog-bar { height:10px; background:#eee; border-radius:6px; overflow:hidden; margin-top:12px; }
.prog-fill { height:100%; background:linear-gradient(90deg, var(--lime), var(--lime-dark)); border-radius:6px; transition:width .6s; }
.prog-stats { display:flex; gap:20px; margin-top:14px; font-size:13px; }
.prog-stats b { font-size:16px; }
.sec-t { font-size:14px; font-weight:700; margin:24px 0 10px; color:#333; }
#map { height:300px; border-radius:16px; border:1px solid var(--line); }
.spot { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.spot-head { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.spot-code { font-weight:700; font-size:15px; }
.spot-addr { font-size:12px; color:var(--mu); margin-top:4px; line-height:1.5; }
.tag { font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap; }
.tag-done { background:#e5f3e0; color:#2a7d2a; }
.tag-wait { background:#f0f0f0; color:#999; }
.spot-date { font-size:11px; color:var(--mu); margin-top:4px; }
.spot-photos { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.spot-photos img { width:74px; height:74px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:pointer; }
.view-btn { font-size:12px; color:var(--lime-dark); font-weight:600; margin-top:8px; cursor:pointer; display:inline-block; }
.loading { text-align:center; padding:60px 20px; color:var(--mu); }
.err { text-align:center; padding:60px 20px; color:#c33; }
.footer { text-align:center; font-size:11px; color:#aaa; margin-top:40px; }
.refresh { position:fixed; bottom:20px; right:20px; background:#111; color:#fff; border:none; border-radius:50%; width:52px; height:52px; min-width:52px; min-height:52px; max-width:52px; max-height:52px; flex:0 0 auto; box-sizing:border-box; padding:0; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; }
.refresh .ric { display:flex; align-items:center; justify-content:center; }
.refresh:active { transform:scale(.92); }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <span class="logo">PLAN B</span>
  <span class="topbar-t">รายงานสถานะการติดตั้งสื่อโฆษณา</span>
</div></div>

<div class="wrap">
  <div id="content"><div class="loading">⏳ กำลังโหลดข้อมูล...</div></div>
  <div class="footer">Plan B Media · ข้อมูลอัปเดตอัตโนมัติจากหน้างานจริง</div>
</div>
<button class="refresh" id="refreshBtn" onclick="load(true)" title="รีเฟรช"><span class="ric"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></span></button>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgA7ohAgzVS4C37dUQh0M3utU5l7Wb17GjURcSCkPXkAW-7XIyhgLbRq_iXl9mVtt0Sg/exec';
var KEY = new URLSearchParams(location.search).get('key') || '';
var map = null, markers = [];
var photoCache = {};

function load(manual) {
  var el = document.getElementById('content');
  setRefreshing(true);
  if (!KEY) { setRefreshing(false); el.innerHTML = '<div class="err">ลิงก์ไม่ถูกต้อง — กรุณาติดต่อ Plan B Media เพื่อรับลิงก์ใหม่ค่ะ</div>'; return; }

  // [SPEED] เปิดซ้ำ → วาดจากข้อมูลรอบก่อนทันที แล้วอัปเดตเบื้องหลัง
  var hadCache = false;
  try {
    var cached = sessionStorage.getItem('pd_' + KEY);
    if (cached) { render(JSON.parse(cached)); hadCache = true; }
  } catch(e) {}
  if (!hadCache) el.innerHTML = '<div class="loading">⏳ กำลังโหลดข้อมูล...</div>';

  fetch(SCRIPT_URL + '?action=portalData&key=' + encodeURIComponent(KEY))
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.error) {
        if (!hadCache) el.innerHTML = '<div class="err">ไม่พบข้อมูลแคมเปญ — กรุณาติดต่อ Plan B Media ค่ะ</div>';
        return;
      }
      var changed = hadCache && window._pdata && sigOf(d) !== sigOf(window._pdata);
      try { sessionStorage.setItem('pd_' + KEY, JSON.stringify(d)); } catch(e) {}
      render(d);
      setRefreshing(false);
      // กดรีเฟรชเองต้องมีคำตอบเสมอ ไม่งั้นลูกค้านึกว่าปุ่มเสีย
      if (manual) showMiniToast(changed ? '🎉 อัปเดตแล้ว — มีรูปใหม่' : '✓ ข้อมูลล่าสุดแล้ว');
    })
    .catch(function(){
      setRefreshing(false);
      if (manual) showMiniToast('⚠️ อัปเดตไม่สำเร็จ — ลองใหม่อีกครั้งค่ะ');
      if (!hadCache) el.innerHTML = '<div class="err">โหลดข้อมูลไม่สำเร็จ — ลองใหม่อีกครั้งค่ะ</div>';
    });
}

// ═══ อัปเดตอัตโนมัติ — ลูกค้าเปิดค้างไว้ รูปใหม่เด้งเอง ไม่ต้องรีเฟรช ═══
// ปุ่มรีเฟรช: หมุนตอนกำลังโหลด ให้รู้ว่าทำงานอยู่
var _spinCss = document.createElement('style');
_spinCss.textContent = '@keyframes pspin{to{transform:rotate(360deg)}}' +
  '.refresh.loading{opacity:.75;pointer-events:none}' +
  '.refresh.loading .ric{animation:pspin .8s linear infinite}';
document.head.appendChild(_spinCss);
function setRefreshing(on) {
  var b = document.getElementById('refreshBtn');
  if (b) b.classList.toggle('loading', !!on);
}

function sigOf(d) {
  try { return d.done + '|' + d.spots.map(function(s){ return s.code + ':' + (s.photos||0) + ':' + (s.imgs?s.imgs.length:0); }).join(','); }
  catch(e) { return ''; }
}

function showMiniToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2e7d32;color:#fff;'+
    'padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:9999;box-shadow:0 6px 22px rgba(0,0,0,.28);'+
    'max-width:90vw;text-align:center';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.transition='opacity .5s'; t.style.opacity='0'; setTimeout(function(){ t.remove(); }, 500); }, 5000);
}

function showUpdateBanner(d, addedDone) {
  if (document.getElementById('pbUpdBanner')) return;
  var b = document.createElement('div');
  b.id = 'pbUpdBanner';
  b.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;'+
    'padding:12px 22px;border-radius:24px;font-size:14px;font-weight:700;z-index:9999;cursor:pointer;'+
    'box-shadow:0 6px 22px rgba(0,0,0,.3);max-width:92vw;text-align:center';
  b.textContent = addedDone > 0 ? ('🎉 ติดตั้งเพิ่ม ' + addedDone + ' จุด — แตะเพื่อดูรูปใหม่') : '📸 มีรูปใหม่ — แตะเพื่ออัปเดต';
  b.onclick = function() { b.remove(); render(d); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.body.appendChild(b);
}

function pollUpdate() {
  if (document.hidden || !KEY || !window._pdata) return;
  fetch(SCRIPT_URL + '?action=portalData&key=' + encodeURIComponent(KEY))
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.error) return;
      if (sigOf(d) === sigOf(window._pdata)) return; // ไม่มีอะไรใหม่
      try { sessionStorage.setItem('pd_' + KEY, JSON.stringify(d)); } catch(e) {}
      var added = (d.done || 0) - (window._pdata.done || 0);
      if (window.scrollY < 120) {
        // อยู่ด้านบนอยู่แล้ว — อัปเดตหน้าให้เลย พร้อมป้ายบอก
        render(d);
        showMiniToast(added > 0 ? ('🎉 อัปเดตแล้ว — ติดตั้งเพิ่ม ' + added + ' จุด') : '📸 รูปติดตั้งอัปเดตแล้ว');
      } else {
        // กำลังเลื่อนดูอยู่ — ไม่กระชากหน้า แสดงแถบให้แตะเอง
        showUpdateBanner(d, added);
      }
    })
    .catch(function(){});
}
setInterval(pollUpdate, 25000);
// สลับกลับมาที่แท็บนี้ → เช็คทันที (ไม่ต้องรอรอบ)
document.addEventListener('visibilitychange', function(){ if (!document.hidden) pollUpdate(); });

function fmtDate(s) {
  if (!s) return '';
  var d = new Date(s);
  if (isNaN(d.getTime())) return String(s).substring(0, 10);
  var m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate() + ' ' + m[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}

function render(d) {
  if (!d.spots) d.spots = []; // กันพัง: ข้อมูลจาก cache เก่า/เพี้ยน ต้องไม่ทำให้จอลูกค้าค้าง
  window._pdata = d; // จำไว้เทียบหารูปใหม่
  try { document.title = d.name + (d.media ? ' · ' + d.media : '') + ' — สถานะติดตั้ง Plan B'; } catch(e) {}
  var pct = d.total ? Math.round(d.done / d.total * 100) : 0;
  var dateLine = d.dateStart ? ('ช่วงติดตั้ง ' + fmtDate(d.dateStart) + (d.dateEnd ? ' — ' + fmtDate(d.dateEnd) : '')) : '';

  var doneSpots = d.spots.filter(function(s){ return s.done; });
  var waitSpots = d.spots.filter(function(s){ return !s.done; });

  function spotHtml(s) {
    return '<div class="spot">' +
      '<div class="spot-head">' +
        '<div style="flex:1">' +
          '<div class="spot-code">' + s.code + '</div>' +
          (s.product ? '<div style="font-size:12px;color:var(--lime-dark);font-weight:600;margin-top:2px">🏷 ' + s.product + (s.media ? ' · ' + s.media : '') + '</div>' : '') +
          '<div class="spot-addr">' + s.address + '</div>' +
          (s.done && s.date ? '<div class="spot-date">📅 ติดตั้งเมื่อ ' + fmtDate(s.date) + '</div>' : '') +
        '</div>' +
        '<span class="tag ' + (s.done ? 'tag-done">✓ ติดตั้งแล้ว' : 'tag-wait">รอติดตั้ง') + '</span>' +
      '</div>' +
      (s.done ? '<div class="spot-photos">' + photosHtml(s) + '</div>' : '') +
    '</div>';
  }

  document.getElementById('content').innerHTML =
    '<div class="head">' +
      (d.media ? '<span class="media-badge">📺 ' + d.media + '</span>' : '') +
      '<h1>' + d.name + '</h1>' +
      (dateLine ? '<div class="dates">' + dateLine + '</div>' : '') +
    '</div>' +
    '<div class="prog-card">' +
      '<div class="prog-nums"><span class="prog-big">' + pct + '%</span><span class="prog-sub">ของงานติดตั้งทั้งหมด</span></div>' +
      '<div class="prog-bar"><div class="prog-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="prog-stats">' +
        '<span>✅ ติดตั้งแล้ว <b>' + d.done + '</b> จุด</span>' +
        '<span>⏳ รอติดตั้ง <b>' + (d.total - d.done) + '</b> จุด</span>' +
        '<span>รวม <b>' + d.total + '</b> จุด</span>' +
      '</div>' +
    '</div>' +
    '<div class="sec-t">🗺 แผนที่จุดติดตั้ง</div><div id="map"></div>' +
    (doneSpots.length ? '<div class="sec-t">✅ ติดตั้งแล้ว (' + doneSpots.length + ')</div>' + doneSpots.map(spotHtml).join('') : '') +
    (waitSpots.length ? '<div class="sec-t">⏳ รอติดตั้ง (' + waitSpots.length + ')</div>' + waitSpots.map(spotHtml).join('') : '');

  renderMap(d.spots);

}

function photosHtml(s) {
  var imgs = s.imgs || [];
  if (!imgs.length) return '<span style="font-size:12px;color:#999">รูปกำลังอัปโหลดเข้าระบบค่ะ</span>';
  return imgs.map(function(im) {
    var id = (im.t.match(/id=([\w-]+)/) || [])[1] || '';
    return '<a href="' + im.u + '" target="_blank">' +
      '<img src="' + im.t + '" data-id="' + id + '" data-retry="0" loading="lazy" onerror="photoFallback(this)"></a>';
  }).join('');
}

function photoFallback(img) {
  // Drive thumbnail sometimes fails for anonymous viewers - retry with lh3 format
  var retry = parseInt(img.getAttribute('data-retry') || '0');
  var id = img.getAttribute('data-id');
  if (retry === 0 && id) {
    img.setAttribute('data-retry', '1');
    img.src = 'https://lh3.googleusercontent.com/d/' + id + '=w400';
  } else if (retry === 1 && id) {
    img.setAttribute('data-retry', '2');
    img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w200';
  } else {
    img.parentNode.style.display = 'none';
  }
}

function renderMap(spots) {
  var pts = spots.filter(function(s){ return s.lat && s.lng; });
  if (!pts.length) { document.getElementById('map').style.display = 'none'; return; }
  // ล้างแผนที่เดิมก่อน — กัน error/memory leak ตอนหน้าอัปเดตอัตโนมัติ
  try { if (map) { map.remove(); map = null; } } catch(e) { map = null; }
  markers = [];
  map = L.map('map').setView([13.7563, 100.5018], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
  var bounds = [];
  pts.forEach(function(s) {
    var color = s.done ? '#5a9e2f' : '#aaaaaa';
    L.circleMarker([s.lat, s.lng], { radius:8, fillColor:color, color:'#fff', weight:2, fillOpacity:.95 })
      .addTo(map)
      .bindPopup('<b>' + s.code + '</b> ' + (s.done ? '<span style="color:#2a7d2a">✓ ติดตั้งแล้ว</span>' : '<span style="color:#999">รอติดตั้ง</span>') +
        (s.product ? '<br><span style="font-size:12px;color:#7a9420;font-weight:600">🏷 ' + s.product + '</span>' : '') +
        '<br><span style="font-size:12px;color:#555">' + s.address + '</span>');
    bounds.push([s.lat, s.lng]);
  });
  map.fitBounds(bounds, { padding: [30, 30] });
}

load();
</script>
</body>
</html>
