<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สถานะการติดตั้ง — Plan B Media</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --f: 'Segoe UI', Sarabun, Tahoma, sans-serif;
  --lime: #a4c639; --lime-dark: #7a9420;
  --ink: #1a1a1a; --mu: #777; --line: #e8e8e8; --bg: #f7f8f6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--f); background:var(--bg); color:var(--ink); }
.wrap { max-width:640px; margin:0 auto; padding:0 16px 60px; }
.topbar { background:#111; color:#fff; padding:14px 0; }
.topbar-in { max-width:640px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:10px; }
.logo { background:var(--lime); color:#111; font-weight:800; font-size:13px; padding:4px 10px; border-radius:6px; letter-spacing:.5px; }
.topbar-t { font-size:13px; color:#bbb; }
.head { padding:26px 0 6px; }
.media-badge { display:inline-block; background:#eef3dc; color:var(--lime-dark); font-size:12px; font-weight:600; padding:4px 12px; border-radius:20px; margin-bottom:8px; }
h1 { font-size:24px; font-weight:700; }
.dates { font-size:13px; color:var(--mu); margin-top:6px; }
.prog-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin:18px 0; }
.prog-nums { display:flex; align-items:baseline; gap:8px; }
.prog-big { font-size:36px; font-weight:800; color:var(--lime-dark); }
.prog-sub { font-size:14px; color:var(--mu); }
.prog-bar { height:10px; background:#eee; border-radius:6px; overflow:hidden; margin-top:12px; }
.prog-fill { height:100%; background:linear-gradient(90deg, var(--lime), var(--lime-dark)); border-radius:6px; transition:width .6s; }
.prog-stats { display:flex; gap:20px; margin-top:14px; font-size:13px; }
.prog-stats b { font-size:16px; }
.sec-t { font-size:14px; font-weight:700; margin:24px 0 10px; color:#333; }
#map { height:300px; border-radius:16px; border:1px solid var(--line); }
.spot { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.spot-head { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.spot-code { font-weight:700; font-size:15px; }
.spot-addr { font-size:12px; color:var(--mu); margin-top:4px; line-height:1.5; }
.tag { font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap; }
.tag-done { background:#e5f3e0; color:#2a7d2a; }
.tag-wait { background:#f0f0f0; color:#999; }
.spot-date { font-size:11px; color:var(--mu); margin-top:4px; }
.spot-photos { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.spot-photos img { width:74px; height:74px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:pointer; }
.view-btn { font-size:12px; color:var(--lime-dark); font-weight:600; margin-top:8px; cursor:pointer; display:inline-block; }
.loading { text-align:center; padding:60px 20px; color:var(--mu); }
.err { text-align:center; padding:60px 20px; color:#c33; }
.footer { text-align:center; font-size:11px; color:#aaa; margin-top:40px; }
.refresh { position:fixed; bottom:20px; right:20px; background:#111; color:#fff; border:none; border-radius:50%; width:52px; height:52px; font-size:20px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.25); }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <span class="logo">PLAN B</span>
  <span class="topbar-t">รายงานสถานะการติดตั้งสื่อโฆษณา</span>
</div></div>

<div class="wrap">
  <div id="content"><div class="loading">⏳ กำลังโหลดข้อมูล...</div></div>
  <div class="footer">Plan B Media · ข้อมูลอัปเดตอัตโนมัติจากหน้างานจริง</div>
</div>
<button class="refresh" onclick="load()" title="รีเฟรช">↻</button>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxAmnIwOxMZ2ntWiZFW7uYLjp-ZfOzSwfMXbO8YS5SzFutOcLoV6AJO4YGnjdQpbH86Cw/exec';
var KEY = new URLSearchParams(location.search).get('key') || '';
var map = null, markers = [];
var photoCache = {};

function load() {
  var el = document.getElementById('content');
  if (!KEY) { el.innerHTML = '<div class="err">ลิงก์ไม่ถูกต้อง — กรุณาติดต่อ Plan B Media เพื่อรับลิงก์ใหม่ค่ะ</div>'; return; }
  el.innerHTML = '<div class="loading">⏳ กำลังโหลดข้อมูล...</div>';
  fetch(SCRIPT_URL + '?action=portalData&key=' + encodeURIComponent(KEY))
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.error) { el.innerHTML = '<div class="err">ไม่พบข้อมูลแคมเปญ — กรุณาติดต่อ Plan B Media ค่ะ</div>'; return; }
      render(d);
    })
    .catch(function(){ el.innerHTML = '<div class="err">โหลดข้อมูลไม่สำเร็จ — ลองใหม่อีกครั้งค่ะ</div>'; });
}

function fmtDate(s) {
  if (!s) return '';
  var d = new Date(s);
  if (isNaN(d.getTime())) return String(s).substring(0, 10);
  var m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate() + ' ' + m[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}

function render(d) {
  var pct = d.total ? Math.round(d.done / d.total * 100) : 0;
  var dateLine = d.dateStart ? ('ช่วงติดตั้ง ' + fmtDate(d.dateStart) + (d.dateEnd ? ' — ' + fmtDate(d.dateEnd) : '')) : '';

  var doneSpots = d.spots.filter(function(s){ return s.done; });
  var waitSpots = d.spots.filter(function(s){ return !s.done; });

  function spotHtml(s) {
    return '<div class="spot">' +
      '<div class="spot-head">' +
        '<div style="flex:1">' +
          '<div class="spot-code">' + s.code + '</div>' +
          '<div class="spot-addr">' + s.address + '</div>' +
          (s.done && s.date ? '<div class="spot-date">📅 ติดตั้งเมื่อ ' + fmtDate(s.date) + '</div>' : '') +
        '</div>' +
        '<span class="tag ' + (s.done ? 'tag-done">✓ ติดตั้งแล้ว' : 'tag-wait">รอติดตั้ง') + '</span>' +
      '</div>' +
      (s.done ? '<div class="spot-photos" id="ph_' + encodeURIComponent(s.code) + '"><span style="font-size:12px;color:#999">⏳ กำลังโหลดรูป...</span></div>' : '') +
    '</div>';
  }

  document.getElementById('content').innerHTML =
    '<div class="head">' +
      (d.media ? '<span class="media-badge">📺 ' + d.media + '</span>' : '') +
      '<h1>' + d.name + '</h1>' +
      (dateLine ? '<div class="dates">' + dateLine + '</div>' : '') +
    '</div>' +
    '<div class="prog-card">' +
      '<div class="prog-nums"><span class="prog-big">' + pct + '%</span><span class="prog-sub">ของงานติดตั้งทั้งหมด</span></div>' +
      '<div class="prog-bar"><div class="prog-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="prog-stats">' +
        '<span>✅ ติดตั้งแล้ว <b>' + d.done + '</b> จุด</span>' +
        '<span>⏳ รอติดตั้ง <b>' + (d.total - d.done) + '</b> จุด</span>' +
        '<span>รวม <b>' + d.total + '</b> จุด</span>' +
      '</div>' +
    '</div>' +
    '<div class="sec-t">🗺 แผนที่จุดติดตั้ง</div><div id="map"></div>' +
    (doneSpots.length ? '<div class="sec-t">✅ ติดตั้งแล้ว (' + doneSpots.length + ')</div>' + doneSpots.map(spotHtml).join('') : '') +
    (waitSpots.length ? '<div class="sec-t">⏳ รอติดตั้ง (' + waitSpots.length + ')</div>' + waitSpots.map(spotHtml).join('') : '');

  renderMap(d.spots);

  // Auto-load photos for installed spots - customer sees proof immediately
  doneSpots.forEach(function(s, i) {
    setTimeout(function(){ loadSpotPhotos(s.code); }, i * 350);
  });
}

function loadSpotPhotos(code) {
  var box = document.getElementById('ph_' + encodeURIComponent(code));
  if (!box) return;
  if (photoCache[code]) { fillPhotos(box, photoCache[code]); return; }
  fetch(SCRIPT_URL + '?action=getPhotos&code=' + encodeURIComponent(code))
    .then(function(r){ return r.json(); })
    .then(function(res) {
      photoCache[code] = res.photos || [];
      fillPhotos(box, photoCache[code]);
    })
    .catch(function(){ box.innerHTML = '<span style="font-size:12px;color:#999">โหลดรูปไม่สำเร็จ — กดรีเฟรชอีกครั้งค่ะ</span>'; });
}

function fillPhotos(el, photos) {
  if (!photos.length) { el.innerHTML = '<span style="font-size:12px;color:#999">รูปกำลังอัปโหลดเข้าระบบค่ะ</span>'; return; }
  el.innerHTML = photos.map(function(p) {
    var id = (p.thumbnail.match(/id=([\w-]+)/) || [])[1] || '';
    return '<a href="' + p.url + '" target="_blank">' +
      '<img src="' + p.thumbnail + '" data-id="' + id + '" data-retry="0" loading="lazy" onerror="photoFallback(this)"></a>';
  }).join('');
}

function photoFallback(img) {
  // Drive thumbnail sometimes fails for anonymous viewers - retry with lh3 format
  var retry = parseInt(img.getAttribute('data-retry') || '0');
  var id = img.getAttribute('data-id');
  if (retry === 0 && id) {
    img.setAttribute('data-retry', '1');
    img.src = 'https://lh3.googleusercontent.com/d/' + id + '=w400';
  } else if (retry === 1 && id) {
    img.setAttribute('data-retry', '2');
    img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w200';
  } else {
    img.parentNode.style.display = 'none';
  }
}

function renderMap(spots) {
  var pts = spots.filter(function(s){ return s.lat && s.lng; });
  if (!pts.length) { document.getElementById('map').style.display = 'none'; return; }
  map = L.map('map').setView([13.7563, 100.5018], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
  var bounds = [];
  pts.forEach(function(s) {
    var color = s.done ? '#5a9e2f' : '#aaaaaa';
    L.circleMarker([s.lat, s.lng], { radius:8, fillColor:color, color:'#fff', weight:2, fillOpacity:.95 })
      .addTo(map)
      .bindPopup('<b>' + s.code + '</b> ' + (s.done ? '<span style="color:#2a7d2a">✓ ติดตั้งแล้ว</span>' : '<span style="color:#999">รอติดตั้ง</span>') +
        '<br><span style="font-size:12px;color:#555">' + s.address + '</span>');
    bounds.push([s.lat, s.lng]);
  });
  map.fitBounds(bounds, { padding: [30, 30] });
}

load();
</script>
</body>
</html>
