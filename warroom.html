<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan B — War Room</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --bg:#0d0f12; --card:#16191e; --tx:#eef0e9; --mu:#8a8f97; --lime:#c8f542; --green:#5DCAA5; --amber:#FAC775; --red:#F09595; --f:'Sarabun','Segoe UI',sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--bg); color:var(--tx); font-family:var(--f); overflow:hidden; }
.wrap { display:flex; flex-direction:column; height:100vh; padding:1.4vh 1.2vw; gap:1.2vh; }

.head { display:flex; justify-content:space-between; align-items:center; }
.head .brand { font-size:2.4vh; font-weight:700; letter-spacing:.5px; }
.head .brand b { color:var(--lime); }
.head .right { display:flex; align-items:center; gap:1.4vw; font-size:2vh; color:var(--mu); }
.live { display:flex; align-items:center; gap:.5vw; color:var(--green); font-weight:600; }
.live .dot { width:1.1vh; height:1.1vh; border-radius:50%; background:var(--green); animation:blink 1.6s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
#clock { font-variant-numeric:tabular-nums; font-weight:600; color:var(--tx); }

.chips { display:flex; gap:.7vw; flex-wrap:wrap; }
.chip { padding:.8vh 1.6vw; border-radius:99px; background:var(--card); color:var(--mu); font-size:2vh; font-weight:600; cursor:pointer; border:1px solid #23262c; user-select:none; transition:all .15s; }
.chip:hover { border-color:var(--lime); color:var(--tx); }
.chip.on { background:var(--lime); color:#0d0f12; border-color:var(--lime); }
#productChips .chip { font-size:1.8vh; padding:.6vh 1.3vw; }
#productChips .chip.on { background:transparent; border:1.5px solid var(--lime); color:var(--lime); }
.chip-note { padding:.6vh 1.3vw; font-size:1.7vh; color:#5a5f67; font-style:italic; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1vw; }
.stat { background:var(--card); border-radius:1.4vh; padding:1.6vh 1.4vw; }
.stat .lb { font-size:1.7vh; color:var(--mu); margin-bottom:.4vh; }
.stat .v { font-size:4.6vh; font-weight:700; line-height:1.1; }
.stat .v small { font-size:2.2vh; color:var(--mu); font-weight:600; }
.v.g { color:var(--green); } .v.l { color:var(--lime); } .v.a { color:var(--amber); }

.main { display:grid; grid-template-columns:1.7fr 1fr; gap:1vw; flex:1; min-height:0; }
.panel { background:var(--card); border-radius:1.4vh; padding:1.4vh 1.2vw; display:flex; flex-direction:column; min-height:0; }
.panel .tt { font-size:1.8vh; color:var(--mu); margin-bottom:.8vh; flex:none; }
#map { flex:1; border-radius:1vh; background:#101318; min-height:0; }
.leaflet-container { background:#101318; font-family:var(--f); }
.leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); } /* แผนที่ OSM สว่าง → กลับสีให้เป็นธีมมืด */

.side { display:flex; flex-direction:column; gap:1vh; min-height:0; }
.side .panel { flex:1; overflow:hidden; }
.dl-row { display:flex; justify-content:space-between; align-items:center; padding:.9vh 0; border-bottom:1px solid #23262c; font-size:2vh; gap:.8vw; }
.dl-row:last-child { border-bottom:none; }
.dl-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dl-meta { white-space:nowrap; font-weight:700; font-variant-numeric:tabular-nums; }
.bar { height:.8vh; background:#23262c; border-radius:99px; margin-top:.5vh; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--green); border-radius:99px; transition:width 1s; }

.feed { display:grid; grid-template-columns:repeat(3,1fr); gap:.8vh; flex:1; min-height:0; align-content:start; }
.ph { position:relative; border-radius:1vh; overflow:hidden; background:#101318; aspect-ratio:4/3; }
.ph img { width:100%; height:100%; object-fit:cover; display:block; }
.ph .cap { position:absolute; left:0; right:0; bottom:0; background:rgba(10,12,15,.82); font-size:1.5vh; padding:.4vh .6vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ph.new { outline:3px solid var(--lime); animation:pop .6s; }
@keyframes pop { 0%{transform:scale(.85)} 60%{transform:scale(1.05)} 100%{transform:scale(1)} }
.empty { color:var(--mu); font-size:1.9vh; padding:2vh 0; text-align:center; }

.pulse-marker { border-radius:50%; }
.pin-wrap { display:flex; flex-direction:column; align-items:center; }
.pin-img { width:6.5vh; height:6.5vh; border-radius:1.1vh; border:3px solid #fff; object-fit:cover; background:#1a1d22; box-shadow:0 .5vh 1.6vh rgba(0,0,0,.55); display:block; }
.pin-dot { width:1.4vh; height:1.4vh; border-radius:50%; background:#5DCAA5; border:2px solid #0d0f12; margin-top:-.5vh; }
.pop-wrap { display:flex; flex-direction:column; align-items:center; animation:photoPop .6s ease; }
.pop-img { width:24vh; height:18vh; border-radius:1.4vh; border:4px solid var(--lime); object-fit:cover; background:#1a1d22; box-shadow:0 1vh 3vh rgba(0,0,0,.7); display:block; }
.pop-cap { background:var(--lime); color:#0d0f12; font-weight:700; font-size:1.9vh; padding:.4vh 1.2vh; border-radius:.8vh; margin-top:.6vh; white-space:nowrap; }
@keyframes photoPop { 0%{transform:scale(0);opacity:0} 65%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
@keyframes ripple { 0%{box-shadow:0 0 0 0 rgba(200,245,66,.7)} 100%{box-shadow:0 0 0 3.2vh rgba(200,245,66,0)} }
.pulse-marker.pulsing { animation:ripple 1.3s ease-out 5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand"><b>PLAN B</b> · War Room</div>
    <div class="right">
      <span id="dateStr"></span>
      <span id="clock">--:--:--</span>
      <span class="live"><span class="dot"></span>LIVE</span>
    </div>
  </div>
  <div id="errBanner" style="display:none;background:#3a1b1b;border:1px solid #ff5c5c;color:#ff9d9d;
    border-radius:10px;padding:10px 16px;margin-bottom:12px;font-size:13px;display:flex;
    align-items:center;justify-content:space-between;gap:12px">
    <span id="errMsg">⚠️ โหลดข้อมูลไม่สำเร็จ</span>
    <button onclick="refresh()" style="background:#ff5c5c;color:#1a1a1a;border:none;border-radius:6px;
      padding:5px 14px;font-weight:700;cursor:pointer;font-family:inherit">ลองใหม่</button>
  </div>

  <div class="chips" id="mediaChips"></div>
  <div class="chips" id="productChips" style="display:none"></div>

  <div class="stats">
    <div class="stat"><div class="lb">ติดตั้งวันนี้</div><div class="v g" id="sToday">–</div></div>
    <div class="stat"><div class="lb">ความคืบหน้ารวม (งานที่กำลังเดิน)</div><div class="v l" id="sAll">–</div></div>
    <div class="stat"><div class="lb">รูปเข้าวันนี้</div><div class="v" id="sPhotos">–</div></div>
    <div class="stat"><div class="lb">งานกำลังเดิน</div><div class="v" id="sJobs">–</div></div>
  </div>

  <div class="main">
    <div class="panel">
      <div class="tt">🗺 แผนที่จุดติดตั้ง — เขียว = ติดแล้ว · เทา = รอติดตั้ง · กะพริบ = เพิ่งเข้า</div>
      <div id="map"></div>
    </div>
    <div class="side">
      <div class="panel">
        <div class="tt">⏱ ใกล้ครบกำหนด</div>
        <div id="deadlines" style="overflow:hidden"><div class="empty">กำลังโหลด...</div></div>
      </div>
      <div class="panel">
        <div class="tt">📸 รูปติดตั้งล่าสุด</div>
        <div class="feed" id="feed"><div class="empty">กำลังโหลด...</div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
if (typeof L === 'undefined') {
  document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');
}
</script>
<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgA7ohAgzVS4C37dUQh0M3utU5l7Wb17GjURcSCkPXkAW-7XIyhgLbRq_iXl9mVtt0Sg/exec';
var POLL_MS = 45000;

// ── นาฬิกา ──
function tick() {
  var n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0') + ':' + String(n.getSeconds()).padStart(2,'0');
  var th = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  var mo = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  document.getElementById('dateStr').textContent = 'วัน' + th[n.getDay()] + ' ' + n.getDate() + ' ' + mo[n.getMonth()] + ' ' + (n.getFullYear() + 543);
}
setInterval(tick, 1000); tick();

// ── กันจอทีวีดับ ──
try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); } catch(e) {}

// ── แผนที่ (โทนมืด) ──
// กันไว้: ถ้าไลบรารีแผนที่โหลดไม่ขึ้น (CDN ล่ม/เน็ตบล็อก) ต้องไม่ทำให้ทั้งหน้าล่ม
var mapOK = (typeof L !== 'undefined');
var map = null, markerLayer = null, popLayer = null;
if (mapOK) {
  try {
    map = L.map('map', { zoomControl:false, attributionControl:false }).setView([13.7563, 100.5018], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map); // CARTO ต้องใช้ API key ตั้งแต่ ส.ค. 2569 → ใช้ OSM ที่ไม่ต้องมี key
    markerLayer = L.layerGroup().addTo(map);
    popLayer = L.layerGroup().addTo(map); // รูปใหม่เด้งใหญ่ชั่วคราว
  } catch(e) { mapOK = false; }
}
if (!mapOK) {
  var mapEl = document.getElementById('map');
  if (mapEl) mapEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;' +
    'color:#8A8F97;font-size:13px;text-align:center;padding:20px">🗺️ แผนที่โหลดไม่ขึ้นชั่วคราว<br>' +
    '<span style="font-size:11px">(ข้อมูลอื่นยังใช้งานได้ปกติ)</span></div>';
}

var prevCounts = null; // 'jobId|CODE' -> count ไว้จับรูปใหม่
var firstLoad = true;
var mediaFilter = '__all__';
var productFilter = '__all__';
// นับจำนวนรูปจริง: imgs คือรูปจริงใน Drive (เชื่อถือได้) · count เป็นตัวเลขจดแยกที่อาจไม่ sync
// ต้องเป็น global function เพราะถูกเรียกจากทั้ง refresh() และ renderAll()
function realCount(o) {
  if (!o) return 0;
  if (o.imgs && o.imgs.length) return o.imgs.length;
  return Number(o.count) || 0;
}
var lastData = null;

function todayStr() {
  var n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}
function dOnly(s) { return s ? String(s).substring(0, 10) : ''; }
function mediaOf(j) { return (j.media && String(j.media).trim()) ? String(j.media).trim() : 'ไม่ระบุสื่อ'; }
function productOf(s, j) {
  if (s && s.product && String(s.product).trim()) return String(s.product).trim();
  if (j && j.name && String(j.name).trim()) return String(j.name).trim();  // ไม่มีสินค้ารายจุด → ใช้ชื่องาน (Job Name / Campaign)
  return 'Unspecified';
}
function keyOf(jobId, code) { return jobId + '|' + String(code).trim().toUpperCase(); }

// ── แถบเลือกสื่อ ──
function renderChips(jobs) {
  var seen = {};
  jobs.forEach(function(j){ seen[mediaOf(j)] = true; });
  var names = Object.keys(seen).sort();
  if (mediaFilter !== '__all__' && !seen[mediaFilter]) mediaFilter = '__all__';
  var el = document.getElementById('mediaChips');
  el.innerHTML = '';
  [{ v:'__all__', t:'All Media' }].concat(names.map(function(n){ return { v:n, t:n }; }))
    .forEach(function(c) {
      var d = document.createElement('div');
      d.className = 'chip' + (mediaFilter === c.v ? ' on' : '');
      d.textContent = c.t;
      d.onclick = function() {
        mediaFilter = c.v;
        productFilter = '__all__'; // เปลี่ยนสื่อ = ดูสินค้าทั้งหมดของสื่อนั้นก่อน
        if (lastData) { renderChips(lastData.jobs); renderAll(lastData.jobs, lastData.log, {}); }
      };
      el.appendChild(d);
    });
  renderProductChips(jobs);
}

// ชิปสินค้า — เฉพาะสินค้าที่มีอยู่ในสื่อที่เลือก (มีสินค้าเดียวก็ไม่ต้องโชว์ให้รก)
function renderProductChips(jobs) {
  var el = document.getElementById('productChips');
  var scope = mediaFilter === '__all__' ? jobs : jobs.filter(function(j){ return mediaOf(j) === mediaFilter; });
  var seen = {};
  scope.forEach(function(j){ (j.spots||[]).forEach(function(s){ seen[productOf(s, j)] = true; }); });
  var names = Object.keys(seen).sort();
  if (productFilter !== '__all__' && !seen[productFilter]) productFilter = '__all__';
  el.style.display = 'flex';
  el.innerHTML = '';
  // ไม่มีข้อมูลแคมเปญเลย → บอกให้รู้ ไม่ใช่ซ่อนเงียบๆ (ผู้ใช้จะได้ไม่คิดว่าระบบพัง)
  var realNames = names.filter(function(n){ return n !== 'Unspecified'; });
  if (realNames.length === 0) {
    var note = document.createElement('div');
    note.className = 'chip-note';
    note.textContent = 'งานนี้ยังไม่ได้ระบุแคมเปญ';
    el.appendChild(note);
    return;
  }
  [{ v:'__all__', t:'All Campaigns' }].concat(names.map(function(n){ return { v:n, t:n }; }))
    .forEach(function(c) {
      var d = document.createElement('div');
      d.className = 'chip' + (productFilter === c.v ? ' on' : '');
      d.textContent = c.t;
      d.onclick = function() {
        productFilter = c.v;
        if (lastData) { renderChips(lastData.jobs); renderAll(lastData.jobs, lastData.log, {}); }
      };
      el.appendChild(d);
    });
}

// ── วาดทั้งจอตามสื่อที่เลือก ──
function renderAll(jobs, log, newKeys) {
  var today = todayStr();
  var mJobs = mediaFilter === '__all__' ? jobs : jobs.filter(function(j){ return mediaOf(j) === mediaFilter; });

  // สินค้าผูกอยู่กับ "จุด" ไม่ใช่ "งาน" → ต้องกรองระดับจุด
  var okSpot = function(s, j) { return productFilter === '__all__' || productOf(s, j) === productFilter; };
  var spotsOf = {};   // jobId -> จุดที่ผ่านตัวกรอง
  var fJobs = [];
  mJobs.forEach(function(j) {
    var ss = (j.spots || []).filter(function(s){ return okSpot(s, j); });
    if (ss.length) { spotsOf[j.id] = ss; fJobs.push(j); }
  });
  var fIds = {};
  fJobs.forEach(function(j){ fIds[j.id] = true; });

  // จุดไหนผ่านตัวกรองบ้าง (ใช้เช็ค log ที่มีแต่ code)
  var okKey = {};
  fJobs.forEach(function(j){ spotsOf[j.id].forEach(function(s){ okKey[keyOf(j.id, s.code)] = true; }); });

  var byKey = {};
  log.forEach(function(e) {
    if (!e.jobId) return;
    byKey[keyOf(e.jobId, e.code)] = e;
  });


  // สถิติ (เฉพาะสื่อที่เลือก)
  var doneToday = 0, photosToday = 0;
  log.forEach(function(e) {
    if (!fIds[e.jobId] || !okKey[keyOf(e.jobId, e.code)]) return;
    if (dOnly(e.date) === today || (e.date && String(e.date).indexOf(today) === 0)) {
      doneToday++; photosToday += realCount(e);
    }
  });
  var allDone = 0, allTotal = 0;
  fJobs.forEach(function(j) {
    spotsOf[j.id].forEach(function(s) {
      allTotal++;
      if (byKey[keyOf(j.id, s.code)]) allDone++;
    });
  });
  document.getElementById('sToday').innerHTML = doneToday + '<small> จุด</small>';
  document.getElementById('sAll').innerHTML = allDone + '<small>/' + allTotal + ' จุด</small>';
  document.getElementById('sPhotos').textContent = photosToday;
  document.getElementById('sJobs').textContent = fJobs.length;

  // แผนที่ — ทำเฉพาะเมื่อไลบรารีโหลดสำเร็จ (ถ้าไม่ ข้ามไปทำส่วนอื่นต่อได้ปกติ)
  if (mapOK && markerLayer) {
  markerLayer.clearLayers();
  var bounds = [];
  fJobs.forEach(function(j) {
    spotsOf[j.id].forEach(function(s) {
      if (!s.lat || !s.lng) return;
      var k = keyOf(j.id, s.code);
      var entry = byKey[k];
      var isDone = !!entry;
      var isNew = !!newKeys[k];
      var thumbId = entry && entry.imgs && entry.imgs.length ? entry.imgs[0] : null;
      var isToday = entry && (dOnly(entry.date) === today || String(entry.date||'').indexOf(today) === 0);

      var m;
      if (isDone && thumbId && isToday) {
        var pinIcon = L.divIcon({ className:'', iconSize:[70,86], iconAnchor:[35,80],
          html: '<div class="pin-wrap"><img class="pin-img" src="https://drive.google.com/thumbnail?id=' + thumbId + '&sz=w200" loading="lazy" alt=""><div class="pin-dot"></div></div>' });
        m = L.marker([s.lat, s.lng], { icon: pinIcon, zIndexOffset: 500 });
      } else {
        var color = isDone ? '#5DCAA5' : '#4a4f57';
        var icon = L.divIcon({ className:'', iconSize:[16,16], iconAnchor:[8,8],
          html: '<div class="pulse-marker' + (isNew ? ' pulsing' : '') + '" style="width:16px;height:16px;background:' + color + ';border:2px solid #0d0f12;border-radius:50%"></div>' });
        m = L.marker([s.lat, s.lng], { icon: icon });
      }
      m.bindTooltip(s.code + (isDone ? ' ✓' : ''), { direction:'top', offset:[0,-8] });
      markerLayer.addLayer(m);
      bounds.push([s.lat, s.lng]);

      // รูปเพิ่งเข้าสดๆ → เด้งใหญ่ 12 วินาที
      if (isNew && thumbId) {
        var popIcon = L.divIcon({ className:'', iconSize:[260,220], iconAnchor:[130,210],
          html: '<div class="pop-wrap"><img class="pop-img" src="https://drive.google.com/thumbnail?id=' + thumbId + '&sz=w600" alt=""><div class="pop-cap">📸 ' + s.code + ' ติดตั้งแล้ว</div></div>' });
        var pm = L.marker([s.lat, s.lng], { icon: popIcon, zIndexOffset: 2000 });
        popLayer.addLayer(pm);
        setTimeout(function(){ try { popLayer.removeLayer(pm); } catch(e) {} }, 12000);
      }
    });
  });
  if (firstLoad && bounds.length) { map.fitBounds(bounds, { padding:[30,30] }); firstLoad = false; }
  } // ── จบบล็อกแผนที่ ──

  // ใกล้ครบกำหนด
  var now = new Date(); now.setHours(0,0,0,0);
  var dls = fJobs.map(function(j) {
    var total = spotsOf[j.id].length;
    var done = spotsOf[j.id].filter(function(s){ return byKey[keyOf(j.id, s.code)]; }).length;
    var end = j.dateEnd ? new Date(dOnly(j.dateEnd)) : null;
    var days = end && !isNaN(end.getTime()) ? Math.round((end - now) / 86400000) : null;
    return { name: j.name, media: j.media||'', total: total, done: done, days: days };
  }).filter(function(x){ return x.total > 0; });
  dls.sort(function(a,b){
    var da = a.days === null ? 9999 : a.days, db = b.days === null ? 9999 : b.days;
    return da - db;
  });
  var el = document.getElementById('deadlines');
  if (!dls.length) { el.innerHTML = '<div class="empty">ไม่มีงานที่ตรงกับตัวกรอง</div>'; }
  else {
    el.innerHTML = dls.slice(0, 5).map(function(x) {
      var pct = x.total ? Math.round(x.done / x.total * 100) : 0;
      var full = x.done >= x.total;
      var lbl, color;
      if (full) { lbl = 'ครบแล้ว ✓'; color = 'var(--green)'; }
      else if (x.days === null) { lbl = x.done + '/' + x.total; color = 'var(--mu)'; }
      else if (x.days < 0) { lbl = 'เลยกำหนด ' + Math.abs(x.days) + ' วัน · ' + x.done + '/' + x.total; color = 'var(--red)'; }
      else if (x.days <= 1) { lbl = (x.days === 0 ? 'วันนี้' : 'เหลือ 1 วัน') + ' · ' + x.done + '/' + x.total; color = 'var(--amber)'; }
      else { lbl = 'เหลือ ' + x.days + ' วัน · ' + x.done + '/' + x.total; color = 'var(--green)'; }
      return '<div><div class="dl-row"><span class="dl-name">' + x.name + (x.media ? ' · ' + x.media : '') + '</span>' +
        '<span class="dl-meta" style="color:' + color + '">' + lbl + '</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join('');
  }

  // ฟีดรูปล่าสุด
  var withImgs = log.filter(function(e){ return fIds[e.jobId] && okKey[keyOf(e.jobId, e.code)] && e.imgs && e.imgs.length; });
  var latest = withImgs.slice(-6).reverse();
  var jobName = {};
  jobs.forEach(function(j){ jobName[j.id] = j.name; });
  var fEl = document.getElementById('feed');
  if (!latest.length) { fEl.innerHTML = '<div class="empty" style="grid-column:1/-1">รอรูปแรก...</div>'; }
  else {
    fEl.innerHTML = latest.map(function(e) {
      var k = e.jobId + '|' + String(e.code).trim().toUpperCase();
      return '<div class="ph' + (newKeys[k] ? ' new' : '') + '">' +
        '<img src="https://drive.google.com/thumbnail?id=' + e.imgs[0] + '&sz=w400" loading="lazy" alt="">' +
        '<div class="cap">' + e.code + (jobName[e.jobId] ? ' · ' + jobName[e.jobId] : '') + '</div></div>';
    }).join('');
  }
}

// ── ดึงข้อมูล ──
function refresh() {
  Promise.all([
    fetch(SCRIPT_URL + '?action=getJobs&view=field').then(function(r){ return r.json(); }),
    fetch(SCRIPT_URL + '?action=getInstallLog').then(function(r){ return r.json(); })
  ]).then(function(res) {
    var jobs = res[0].jobs || [];
    var log = res[1].log || [];

    // จับ "รูปใหม่" เทียบกับรอบก่อน (ดูจาก log ทั้งหมด ไม่เกี่ยวกับสื่อที่เลือก)
    var newKeys = {}, counts = {};
    log.forEach(function(e) {
      if (!e.jobId) return;
      var k = e.jobId + '|' + String(e.code).trim().toUpperCase();
      counts[k] = realCount(e);
      if (prevCounts && counts[k] > (prevCounts[k]||0)) newKeys[k] = true;
    });

    lastData = { jobs: jobs, log: log };
    renderChips(jobs);
    renderAll(jobs, log, newKeys);
    prevCounts = counts;
    document.getElementById('errBanner').style.display = 'none'; // โหลดสำเร็จ ซ่อน error เดิม (ถ้ามี)
  }).catch(function(err){
    // ถ้าเคยมีข้อมูลอยู่แล้ว (โหลดรอบก่อนสำเร็จ) ให้คงของเดิมไว้เงียบๆ ตามที่ตั้งใจ
    // แต่ถ้ายังไม่เคยโหลดสำเร็จเลย (รอบแรก) ต้องบอกผู้ใช้ ไม่ปล่อยให้ค้าง "กำลังโหลด..." เงียบๆ
    if (!lastData) {
      document.getElementById('errMsg').textContent = '⚠️ โหลดข้อมูลไม่สำเร็จ (อาจเพราะข้อมูลเยอะ/เน็ตช้า) — กดลองใหม่';
      document.getElementById('errBanner').style.display = 'flex';
    }
  });
}
refresh();
setInterval(refresh, POLL_MS);
</script>

// หาบรรทัดตัวอักษรในภาพ (connected components → จัดกลุ่มเป็นบรรทัด) แล้วตัดออกมาทีละบรรทัดเพื่ออ่านแบบ psm 7
function aiqGray(img){
  var W=img.width,H=img.height,c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d'); x.drawImage(img,0,0);
  var p=x.getImageData(0,0,W,H).data, g=new Uint8Array(W*H), hist=new Array(256).fill(0);

    ch.sort(function(a,b){return a.x0-b.x0;});

      for (var bb=a+1;bb<ch.length;bb++){ var B=ch[bb]; if (B.x0-A.x1>ha*1.6) break; var hb=B.y1-B.y0+1, cb=(B.y0+B.y1)/2;

// หาบรรทัด 2 ขนาดหน้าต่าง (ตัวเล็ก/ตัวใหญ่) แล้วตัดกล่องที่ซ้ำกันออก

  all.forEach(function(b){ var dup=out.some(function(o){ var ix=Math.max(0,Math.min(o.x1,b.x1)-Math.max(o.x0,b.x0)), iy=Math.max(0,Math.min(o.y1,b.y1)-Math.max(o.y0,b.y0));

// ตรรกะเทียบ Code — ตัวเดียวกับที่จะใส่ใน admin.html
function aiqCanon(s){
  return String(s||'').toUpperCase().replace(/[\s\-_.,:;·\/\\|'"`~()\[\]{}]/g,'')
    .replace(/O/g,'0').replace(/[IL|]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2').replace(/G/g,'6').replace(/Q/g,'0');
}
function aiqLev(a,b){ var m=a.length,n=b.length,d=[]; for(var i=0;i<=m;i++){d[i]=[i];} for(var j=1;j<=n;j++) d[0][j]=j;
  for(i=1;i<=m;i++) for(j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
// พบ code ในข้อความไหม: ตรงเป๊ะ หรือ (code ยาว ≥5) ผิดได้ 1 ตัวอักษร
function aiqFind(textCanon, code){
  var c=aiqCanon(code); if(!c) return false;
  if (textCanon.indexOf(c)>-1) return true;
  if (c.length<5) return false;
  for (var L=c.length-1; L<=c.length+1; L++) for (var i=0;i+L<=textCanon.length;i++) if (aiqLev(textCanon.substr(i,L),c)<=1) return true;
  return false;
}
// ตัดสินผลของ 1 จุด จากข้อความทุกบรรทัดที่อ่านได้
// ลำดับ: ตรงเป๊ะกับ Code จุดนี้ → ตรงเป๊ะกับ Code จุดอื่น (ติดผิดป้าย) → ใกล้เคียง (ผิด 1 ตัว) แบบไม่กำกวม → อ่านไม่ได้
function aiqNear(textCanon, c){ if (c.length<5) return false;
  for (var L=c.length-1; L<=c.length+1; L++) for (var i=0;i+L<=textCanon.length;i++) if (aiqLev(textCanon.substr(i,L),c)<=1) return true; return false; }
function aiqJudge(texts, expected, known){
  var T=texts.map(aiqCanon), ce=aiqCanon(expected);

    .filter(function(o){ return o.c.length>=4 && o.c!==ce && ce.indexOf(o.c)<0 && o.c.indexOf(ce)<0; });

  var near=function(c){ return T.some(function(t){ return aiqNear(t,c); }); };
  if (ce && has(ce)) return { ocr:'match' };
  var exactOther=others.find(function(o){ return has(o.c); });
  if (exactOther) return { ocr:'other', found:exactOther.code };
  var nearMe = ce.length>=5 && near(ce);
  var nearOther = others.filter(function(o){ return o.c.length>=6 && near(o.c); });
  if (nearMe && !nearOther.length) return { ocr:'match' };
  if (!nearMe && nearOther.length===1) return { ocr:'other', found:nearOther[0].code };
  return { ocr:'none' };   // ไม่เจอ หรือคลุมเครือ → ไม่เตือน ไม่ยืนยัน
}

var _aiqOcr = {}, _aiqTessP = null;
function aiqLoadTess() {
  if (_aiqTessP) return _aiqTessP;
  _aiqTessP = new Promise(function(res, rej) {
    if (window.Tesseract) return res(window.Tesseract);
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = function(){ res(window.Tesseract); }; s.onerror = function(){ _aiqTessP = null; rej(new Error('โหลดตัวอ่าน Code ไม่สำเร็จ')); };
    document.head.appendChild(s);
  });
  return _aiqTessP;
}
// Code ภาษาอังกฤษ/ตัวเลข → โหมดอังกฤษ อ่านเฉพาะ A-Z 0-9 - (กันอ่านเป็นตัวไทย) · Code มีตัวไทย → โหมดไทย+อังกฤษ
function aiqOcrWorker(thai) {
  var k = thai ? 'tha' : 'eng';
  if (_aiqOcr[k]) return _aiqOcr[k];
  aiqChip('🤖 กำลังโหลดตัวอ่าน Code (' + (thai ? 'ไทย' : 'อังกฤษ') + ')...');
  _aiqOcr[k] = aiqLoadTess().then(function(T) {
    return T.createWorker(thai ? ['tha', 'eng'] : 'eng', 1);
  }).then(function(w) {
    var prm = { tessedit_pageseg_mode: '7' };
    if (!thai) prm.tessedit_char_whitelist = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-';
    return w.setParameters(prm).then(function(){ return w; });
  });
  _aiqOcr[k].catch(function(){ _aiqOcr[k] = null; });
  return _aiqOcr[k];
}
// หาบรรทัดตัวอักษรในรูป → หมุนให้ตรง → อ่านทีละบรรทัด → เทียบกับ Code ของจุดนี้และ Code อื่นในระบบ
function aiqReadCode(dataUrl, expected, known) {

  return img.decode().then(function() { return aiqOcrWorker(thai); }).then(function(worker) {

    function next() {
      if (i >= boxes.length) return Promise.resolve(aiqJudge(texts, expected, known));
      return worker.recognize(aiqCropLine(G, boxes[i++])).then(function(r) {
        texts.push((r.data && r.data.text || '').trim());
        var j = aiqJudge(texts, expected, known);
        return j.ocr === 'match' ? j : next();          // เจอ Code ตรงแล้ว หยุดได้เลย
      });
    }
    return next();
  }).catch(function(err) { console.warn('OCR:', err); return { ocr: 'none' }; });
}
function aiqFetchState() {
  return fetch(SCRIPT_URL + '?action=aiPending').then(function(r){ return r.json(); })
    .then(function(d) { if (!d.error) _aiqState = d; return _aiqState; });
}

// ตรวจรูปที่ยังไม่เคยตรวจทั้งหมด แล้วบันทึกผลลงชีท
function aiRun() {
  if (_aiqBusy) return Promise.resolve();
  _aiqBusy = true;
  return aiqFetchState().then(function(st) {
    var pend = st.pending || [];
    if (!pend.length) return;
    return aiqLoadModel().then(function(pipe) {
      var done = 0, batches = [], codeOf = {}, known = aiqKnownCodes();
      pend.forEach(function(x){ codeOf[x.id] = x.code; });
      for (var i = 0; i < pend.length; i += 3) batches.push(pend.slice(i, i + 3));
      return batches.reduce(function(chain, b) {
        return chain.then(function() {
          var ids = b.map(function(x){ return x.id; });
          return fetch(SCRIPT_URL + '?action=aiThumbs&full=1&ids=' + ids.join(',')).then(function(r){ return r.json(); })
            .then(function(res) {
              var thumbs = res.thumbs || [], rows = [], got = {};
              return thumbs.reduce(function(q, t) {
                return q.then(function() {
                  got[t.id] = true;
                  return aiqClassify(pipe, t.data).then(function(c) {
                    return aiqReadCode(t.data, codeOf[t.id], known).then(function(o) {
                      done++; aiqChip('🤖 AI ตรวจรูปใหม่ ' + done + '/' + pend.length);
                      var reasons = [];
                      if (c.flag) reasons.push(c.reason);
                      if (o.ocr === 'other') reasons.push('อาจติดผิดป้าย — อ่านได้ ' + o.found);
                      var flag = reasons.length > 0;
                      if (flag) _aiqThumbCache[t.id] = t.data;
                      rows.push({ fileId: t.id, result: flag ? 'flag' : 'ok', reason: reasons.join(' · '),
                        score: o.ocr === 'other' ? 1 : c.score, ocr: o.ocr === 'other' ? 'other:' + o.found : o.ocr });
                    });
                  });
                });
              }, Promise.resolve()).then(function() {
                ids.forEach(function(id){ if (!got[id]) { done++; rows.push({ fileId: id, result: 'skip' }); } }); // ดึงรูปไม่ได้ → ข้าม ไม่วนมาดึงซ้ำ
                if (rows.length) return fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'aiSaveChecks', rows: rows }) });
              });
            });
        });
      }, Promise.resolve());
    }).then(aiqFetchState);
  }).catch(function(err) {
    console.warn('AI ตรวจรูปไม่สำเร็จ:', err);
    aiqChip('🤖 ใช้งาน AI ไม่ได้ — ตรวจว่าเครือข่ายอนุญาต cdn.jsdelivr.net / huggingface.co', true);
    setTimeout(aiqRefreshChip, 8000);
  }).then(function() {
    _aiqBusy = false;
    aiqRefreshChip();
  });
}

function aiqKnownCodes() {
  var out = [];
  ((lastData && lastData.jobs) || []).forEach(function(j){ (j.spots || []).forEach(function(s){ if (s.code) out.push(String(s.code)); }); });
  return out;
}
// แถบสถานะบนจอ War Room — การตัดสินรูปที่ติดธงทำใน Snaphub
function aiqRefreshChip() {
  if (_aiqBusy) return;
  var s = _aiqState.stats || {}, f = (_aiqState.flags || []).length;
  aiqChip('🤖 AI ตรวจรูปแล้ว ' + (s.checked || 0) + ' รูป · อ่าน Code ตรง ' + (s.codeMatch || 0) + ' จุด' +
    (f ? ' · ⚠️ รอแอดมินตรวจใน Snaphub ' + f + ' รูป' : ' · ✓ ไม่มีรูปค้างตรวจ'), f > 0);
}
// ตรวจอัตโนมัติ: เริ่มหลังข้อมูลงานโหลดแล้ว + ตรวจรอบใหม่ทุก 5 นาที (จอ War Room เปิดค้างไว้)
(function aiqStart(tries) {
  if (!lastData && tries < 60) return setTimeout(function(){ aiqStart(tries + 1); }, 2000);
  if (AIQ_AUTO) { aiRun(); setInterval(aiRun, 5 * 60 * 1000); }
  else aiqFetchState().then(aiqRefreshChip).catch(function(){});
})(0);
</script>
